<style>
    body{


        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(55deg, rgb(240, 237, 237), gray);
    }
    .btn {
    
    margin: 0 auto;
    border-radius: 10px;
    box-shadow: 0px 3px rgba(128, 128, 128, 1),
        0px 4px rgba(118, 118, 118, 1),
        0px 5px rgba(108, 108, 108, 1),
        0px 6px rgba(98, 98, 98, 1),
        0px 7px rgba(88, 88, 88, 1),
        0px 8px rgba(78, 78, 78, 1),
        0px 14px 6px -1px #000000;

    transition: box-shadow .1s ease-in-out;
    font-family: Arial, Helvetica, sans-serif;
    cursor: pointer;
    text-decoration: none;
    user-select: none;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    border: none;
    padding: 0;
    background: none;
    /*** full width block ***/
    /* width: 100%; */
}
.btn:hover{
    transition: 1s;
    transform: scale(1.2,1);
    
}

.btn span {
    width: 100%;
    height: 100%;
    background-color: #E8E8E8;
    box-shadow: 0px -1px #fff,
        0px 1px 1px #FFFFFF;
    border-radius: 10px;
    transition: transform .1s ease-in-out;
    display: inline-block;
    padding: 12px 20px;
    color: #3A474D;
     text-transform: uppercase;
   
    font-size: 18px;
}

.btn:hover span {
    color: #353535;
    text-shadow: 0px -1px #cfcfcf;
}

.btn:active {
    box-shadow: 0px 10px 0px -2px #aaa9a9;
}

.btn:active span {
    transform: translate(0, 5px);
}

/*** disabled style ***/
.btn:disabled {
    pointer-events: none;
    opacity: .65;
    color: #7e7e7e;
    background: #dcdcdc;
    box-shadow: none;
    text-shadow: none;
}

/*** dark mode ***/
html.dark-mode .btn-174 {
    box-shadow: 0px 3px rgba(128, 128, 128, 1),
        0px 4px rgba(118, 118, 118, 1),
        0px 5px rgba(108, 108, 108, 1),
        0px 6px rgba(98, 98, 98, 1),
        0px 7px rgba(88, 88, 88, 1),
        0px 8px rgba(78, 78, 78, 1),
        0px 14px 6px -1px #000000;
}
</style>




<button class="btn">
    <span>Button</span>
</button>
