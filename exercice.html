<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login form exercie</title>
</head>
<body>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto&display=swap');
    
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:'poppins','sans-serif';
}
body{
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(50deg, rgb(255, 255, 255), rgb(170, 170, 170), gray);

}
.login-header{
    text-align: center;
    margin: 20px 0px 40px 0px;
}
.login-header header{
    color: rgb(56, 56, 56);
    font-size: 35px;
    font-weight: 800;

}
.input-box .input-field{
    width: 100%;
    height: 60px;
    font-size: 20px;
    padding: 0px 25px;
    margin-bottom: 15px;
    border: none;
    border-radius: 30px;
    box-shadow: 0px 5px 10px rgb(105, 105, 105);
    outline: none;
    transition: .3s;

}
.input-field:focus{
    transform: scale(1.2,1);
    background-color: rgb(177, 174, 174);
    transition: 1s;
    color: white;
}
.forgot{
    display: flex;
    justify-content: space-between;
    margin-bottom: 40px;
}
section{
    display: flex;
    align-items: center;
    font-size: 14px;
    color: #3b3b3b;
}
a{
    color: #000000;
    text-decoration: none;
   
}
a:focus{
    color: rgb(75, 73, 73);
    transition: 0.3s;
}
a:hover{
    text-decoration: underline;
}

.sumbit-btn{
    width: 100%;
    height: 50px;
    cursor: pointer;
    background-color: #000000;
    color: white;
    font-size: 25px;
    font-weight: 600;
    border: none;
    border-radius: 40px;
    box-shadow: 2px 5px 11px rgb(54, 52, 52);
}
.sumbit-btn:hover{
    background-color: rgb(116, 116, 116);
    color: #fdfcfc;
    transition: 1s;
    transform: scale(1.1,1)
    
}
.sumbit-btn:active{
    box-shadow: 0px 20px 40px gray

}






.sign-up-link{
    text-align: center;
    font-size: 15px;
    margin-top: 20px;
}
 .sign-up-link a{
    color: #000;
    font-weight: 600;
 }


 </style>
    <div class="login-form">

     <div class="login-header">
        <header>Login</header>
     </div>

        <div class="input-box">
        <input type="text" class="input-field" placeholder="Email" autocomplete="off" required>
        </div>

          <div class="input-box">
        <input type="password" class="input-field" placeholder="Password" autocomplete="off" required>
        </div>

    <div class="forgot">
        <section>
            <input type="checkbox" id="check">
            <label for="check">Remember me</label>
        </section>

        <section>
            <a href="#">Forgot password?</a>
        </section>
    </div>

    <div class="input-submit">
        <button class="sumbit-btn">sign in</button>
        
    </div>

    <div class="sign-up-link">
        <p>Don't have an account? <a href="#">Sign Up</a></p>
    </div>

</div>
</body>
</html>
