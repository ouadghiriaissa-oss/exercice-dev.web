<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
</head>

<body>
    <style>
        body{
            background: linear-gradient(95deg, rgb(187, 187, 187),rgb(63, 62, 62));
        }
       .txt{
        width: 180px;
        height: 60px;
        border: none;
        border-radius: 30px;
        box-shadow: 0px 5px 10px rgb(68, 65, 65);
        display: block;
        margin: 0 auto;
        
    
        }
        .txt::placeholder{
            padding: 20px;
            border: none;
            
        }
        .txt:focus{
            outline: none;
            color: gray;
            transform: scale(1.2,1);
            transition: 1s;
        }
        
/*"Try to do the others by yourself ♥☻*/


    </style>

    <h1>Profile</h1>

    <form>

        <!-- Text -->
    
        <input class="txt" type="text" id="fullname" name="fullname" placeholder="Enter your full name">
        <br><br>
   

        <!-- Email -->
        <input type="email" id="email" name="email" placeholder="example@email.com">
 
        <!-- Password -->
        <br><br>

        <input type="password" id="password" name="password" placeholder="Enter your password">
        <br><br>

        <!-- Date -->
        <label for="birthdate">Birth Date:</label>
        <input type="date" id="birthdate" name="birthdate">
        <br><br>

        <!-- Number -->
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1" max="100">
        <br><br>

        <!-- Radio buttons -->
        <p>Gender:</p>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <br><br>

        <!-- Checkbox -->
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Remember me</label>

        <br><br>

        <!-- Select -->
        <label for="country">Country:</label>

        <select id="country" name="country">
            <option value="">Select your country</option>
            <option value="morocco">Morocco</option>
            <option value="france">France</option>
            <option value="spain">Spain</option>
            <option value="usa">United States</option>
            <option value="canada">Canada</option>
        </select>

        <br><br>

        <!-- File -->
        <label for="photo">Profile Picture:</label>
        <input type="file" id="photo" name="photo">

        <br><br>

        <!-- choose your Color -->
        <label for="color">choose your Color:</label>
        <input type="color" id="color" name="color">

        <br><br>

        <!-- Range -->
        <label for="level">Programming Level:</label>
        <input type="range" id="level" name="level" min="0" max="100">

        <br><br>


        <!-- Telephone -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="+212 600000000">

        <br><br>

        <!-- Message -->
        <label for="message">About You:</label>
        <br>
        <textarea id="message" name="message" rows="5" cols="40"
                  placeholder="Tell us about yourself..."></textarea>

        <br><br>

        <!-- Submit -->
        <input type="submit" value="Create Profile">

        <!-- Reset -->
        <input type="reset" value="Reset">

    </form>

</body>
</html>
